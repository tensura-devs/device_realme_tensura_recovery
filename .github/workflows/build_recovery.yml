name: Build TWRP Recovery

on:
  push:
    branches:
      - twrp-12.1-C.20-v2
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-12.0
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/tensura-devs/device_realme_tensura_recovery'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'twrp-12.1-C.20-v2'
      DEVICE_PATH:
        description: 'Device Path di dalam source tree'
        required: true
        default: 'device/realme/RMX3630'
      DEVICE_NAME:
        description: 'Device Codename (nama folder out/target/product/)'
        required: true
        default: 'RMX3630'
      PRODUCT_NAME:
        description: 'Lunch target (biasanya twrp_CODENAME)'
        required: true
        default: 'twrp_RMX3630'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
          - vendorboot
          - recovery
          - boot

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-20.04
    env:
      MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH || 'twrp-12.1' }}
      DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL || 'https://github.com/tensura-devs/device_realme_tensura_recovery' }}
      DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH || 'twrp-12.1-C.20-v2' }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH || 'device/realme/RMX3630' }}
      DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME || 'RMX3630' }}
      PRODUCT_NAME: ${{ github.event.inputs.PRODUCT_NAME || 'twrp_RMX3630' }}
      BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET || 'vendorboot' }}

    steps:
      # ──────────────────────────────────────────
      # 1. Checkout repo ini
      # ──────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. Tambah swap agar tidak OOM
      # ──────────────────────────────────────────
      - name: Set Swap Space (12GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      # ──────────────────────────────────────────
      # 3. Install dependensi build
      # ──────────────────────────────────────────
      - name: Setup Build Environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 git-lfs

          # Install repo tool
          mkdir -p ~/bin
          curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # ──────────────────────────────────────────
      # 4. Konfigurasi Git
      # ──────────────────────────────────────────
      - name: Configure Git Identity
        run: |
          git config --global user.email "tensura-devs@github.com"
          git config --global user.name "Tensura Devs CI"
          git config --global color.ui false

      # ──────────────────────────────────────────
      # 5. CCache untuk mempercepat build berikutnya
      # ──────────────────────────────────────────
      - name: Setup CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-twrp-${{ env.DEVICE_NAME }}-${{ github.sha }}
          restore-keys: |
            ccache-twrp-${{ env.DEVICE_NAME }}-

      - name: Configure CCache
        run: |
          ccache -M 10G
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV

      # ──────────────────────────────────────────
      # 6. Init TWRP manifest
      # ──────────────────────────────────────────
      - name: Initialize TWRP Manifest
        run: |
          mkdir -p ~/twrp-workspace
          cd ~/twrp-workspace
          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b ${{ env.MANIFEST_BRANCH }}

      # ──────────────────────────────────────────
      # 7. Inject device tree via local manifest
      #    RMX3630 | Board SKU: RE8DDCL1
      # ──────────────────────────────────────────
      - name: Add Device Tree via Local Manifest
        run: |
          mkdir -p ~/twrp-workspace/.repo/local_manifests
          cat > ~/twrp-workspace/.repo/local_manifests/rmx3630.xml << 'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="tensura-github"
                    fetch="https://github.com/tensura-devs/"
                    review="" />
            <project
              name="device_realme_tensura_recovery"
              path="device/realme/RMX3630"
              remote="tensura-github"
              revision="${{ env.DEVICE_TREE_BRANCH }}" />
          </manifest>
          XMLEOF

      # ──────────────────────────────────────────
      # 8. Sync source
      # ──────────────────────────────────────────
      - name: Sync Source
        run: |
          cd ~/twrp-workspace
          repo sync \
            -j$(nproc --all) \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune
        timeout-minutes: 60

      # ──────────────────────────────────────────
      # 9. Build vendor_boot image
      #    - TARGET_DEVICE_ALT diset ke RE8DDCL1
      #      agar BoardConfig yang membaca DT_BOARD
      #      bisa mengambil nilai alternatif device
      # ──────────────────────────────────────────
      - name: Build TWRP
        run: |
          cd ~/twrp-workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TARGET_DEVICE_ALT="RE8DDCL1"
          source build/envsetup.sh
          lunch ${{ env.PRODUCT_NAME }}-eng
          mka ${{ env.BUILD_TARGET }}image -j$(nproc --all) 2>&1 | tee build.log
        timeout-minutes: 120

      # ──────────────────────────────────────────
      # 10. Upload log jika build gagal
      # ──────────────────────────────────────────
      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.DEVICE_NAME }}
          path: ~/twrp-workspace/build.log
          retention-days: 3

      # ──────────────────────────────────────────
      # 11. Kumpulkan semua output image
      # ──────────────────────────────────────────
      - name: Collect Output Files
        run: |
          OUT="out/target/product/${{ env.DEVICE_NAME }}"
          echo "OUT_DIR=$OUT" >> $GITHUB_ENV

          BUILD_DATE=$(date +%Y%m%d-%H%M)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

          TAG="TWRP-12.1-RMX3630-RE8DDCL1-$BUILD_DATE"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          cd ~/twrp-workspace
          echo "=== Output files ==="
          ls -lh "$OUT"/*.img 2>/dev/null || echo "Tidak ada .img ditemukan!"

          # Salin semua img ke folder upload
          mkdir -p ~/twrp-workspace/upload
          for f in vendor_boot.img vendor_boot-debug.img boot.img recovery.img; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" ~/twrp-workspace/upload/ && echo "Copied: $f"
          done
          # Juga cari TWRP zip jika ada
          find "$OUT" -maxdepth 1 -name "*.zip" -exec cp {} ~/twrp-workspace/upload/ \;

      # ──────────────────────────────────────────
      # 12. Upload sebagai GitHub Actions Artifact
      # ──────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: ~/twrp-workspace/upload/
          if-no-files-found: error
          retention-days: 7

      # ──────────────────────────────────────────
      # 13. Buat GitHub Release otomatis
      # ──────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "TWRP 12.1 | Realme RMX3630 (RE8DDCL1) | ${{ env.BUILD_DATE }}"
          prerelease: true
          body: |
            ## TWRP 12.1 Build — Realme RMX3630 (RE8DDCL1)

            | Info | Detail |
            |------|--------|
            | Device | Realme RMX3630 |
            | Board / SKU | RE8DDCL1 |
            | Build Date | ${{ env.BUILD_DATE }} |
            | Branch | `${{ env.DEVICE_TREE_BRANCH }}` |
            | Build Target | `${{ env.BUILD_TARGET }}` |
            | Manifest | TWRP AOSP 12.1 |

            ### Cara Flash
            ```bash
            # Untuk GKI device (vendor_boot)
            fastboot flash vendor_boot vendor_boot.img
            fastboot reboot recovery
            ```

            > ⚠️ **Ini adalah build otomatis CI.** Test dulu sebelum dipakai di daily driver.
          files: ~/twrp-workspace/upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
